name: User edition source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.32"
      - run: uv venv --python 3.12
      - run: uv pip sync --python .venv/bin/python requirements.local.lock
      - run: uv pip install --python .venv/bin/python pytest==9.1.1
      - run: .venv/bin/python -m pytest -q tests/test_api.py tests/test_collection_orders.py tests/test_collection_reuse.py tests/test_identity.py tests/test_review.py tests/test_local_distribution.py tests/test_runtime_environment.py tests/test_data_quality.py
