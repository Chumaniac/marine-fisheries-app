name: Verified showcase release
on:
  push:
    tags: ['showcase-*']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact verified main source and a new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^showcase-[0-9]{4}[.][0-9]{2}[.][0-9]{2}(-[0-9]+)?$ ]]
          refs=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          source=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ {print $1;exit}')
          [[ -n "$source" ]] || source=$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')
          test "$source" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/user-edition.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" > "$RUNNER_TEMP/source-ci.json"
          python3 - "$RUNNER_TEMP/source-ci.json" <<'PY'
          import json,os,sys
          runs=json.load(open(sys.argv[1]))['workflow_runs']
          assert any(r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='main' and r['conclusion']=='success' for r in runs)
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
      - name: Archive only the public static demonstration and licenses
        run: |
          set -euo pipefail
          mkdir release
          python3 - <<'PYBOUND'
          import os,subprocess
          from pathlib import PurePosixPath
          listing=subprocess.check_output(['git','ls-tree','-rl',os.environ['GITHUB_SHA'],'--','showcase','LICENSE','THIRD_PARTY_NOTICES.md'],text=True)
          total=0;rows=listing.splitlines();assert 1<=len(rows)<=256
          for line in rows:
              header,name=line.split('\t',1);mode,kind,blob,size=header.split();size=int(size);total+=size
              assert mode in ['100644','100755'] and kind=='blob' and size<=8*1024**2
              assert not any(part.startswith('.') or part=='..' for part in PurePosixPath(name).parts)
          assert total<=32*1024**2
          PYBOUND
          git archive --format=zip --prefix=marine-showcase/ --output=release/marine-showcase.zip "$GITHUB_SHA" showcase LICENSE THIRD_PARTY_NOTICES.md
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          archive=Path('release/marine-showcase.zip')
          with zipfile.ZipFile(archive) as bundle:
              names=bundle.namelist()
              assert all(n.startswith('marine-showcase/showcase/') or n in ['marine-showcase/','marine-showcase/LICENSE','marine-showcase/THIRD_PARTY_NOTICES.md'] for n in names)
              assert 'marine-showcase/showcase/index.html' in names
          Path('release/source-manifest.json').write_text(json.dumps({'schema':'marine.showcase/v1','sourceCommit':os.environ['GITHUB_SHA'],'tag':os.environ['GITHUB_REF_NAME'],'artifact':'marine-showcase.zip','sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'entry':'showcase/index.html','data':'synthetic; no provider connection','files':names},indent=2)+'\n')
          PY
          (cd release && sha256sum *.zip *.json > checksums.txt)
      - name: Attest the public static distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.zip
      - name: Publish without replacing previous desktop or showcase assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Existing releases are immutable' >&2; exit 1; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "澜知海洋 · 公开证据示例 $GITHUB_REF_NAME" --notes '观测、样本复核、批次证据与验收说明的固定合成示例。运行showcase静态目录即可体验，不连接现场、模型或账本。附源码身份、SHA-256和构建来源证明。' release/*
